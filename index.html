<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Libreta Especial</title>
  <style>
    body { background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Georgia', serif; }
    
    /* El libro */
    .book { width: 350px; height: 500px; background: white; border-radius: 5px; box-shadow: 0 0 20px rgba(0,0,0,0.5); position: relative; perspective: 1000px; }
    
    .page { position: absolute; width: 100%; height: 100%; background: #fdfaf6; padding: 40px; box-sizing: border-box; backface-visibility: hidden; transition: transform 0.8s; transform-origin: left; display: none; }
    .active { display: block; }
    
    /* Efecto de vuelta de página */
    .flipped { transform: rotateY(-180deg); }
    
    h1 { color: #d65a70; }
    img { width: 150px; border-radius: 10px; margin: 20px 0; }
    .audio-btn { background: #ffb6c1; padding: 10px; border-radius: 5px; cursor: pointer; display: inline-block; }
    
    .nav { position: absolute; bottom: 20px; width: 100%; display: flex; justify-content: space-around; }
    button { background: #d65a70; color: white; border: none; padding: 10px; cursor: pointer; }
  </style>
</head>
<body>

<div class="book" id="book">
    <!-- PORTADA -->
    <div class="page active">
        <h1>Para Alexandra 💖</h1>
        <img src="portada.jpg" alt="Pusheen y Camarón">
        <p>Este es nuestro libro de momentos.</p>
        <div class="audio-btn" onclick="document.getElementById('cancionLove').play()">🔊 Escuchar canción</div>
        <audio id="cancionLove" src="love-zoe.mp3"></audio>
    </div>

    <!-- PÁGINAS -->
    <div class="page"><h3>PÁGINA 2</h3><p>Contenido de la página 2...</p></div>
    <div class="page"><h3>PÁGINA 3</h3><p>Contenido de la página 3...</p></div>
    <!-- ... Aquí sigues añadiendo <div class="page">...</div> hasta la 25 -->
    <div class="page"><h3>PÁGINA 25</h3><p>Fin del libro.</p></div>

    <div class="nav">
        <button onclick="prevPage()">◀ Anterior</button>
        <button onclick="nextPage()">Siguiente ▶</button>
    </div>
</div>

<script>
    let current = 0;
    const pages = document.querySelectorAll('.page');
    function nextPage() {
        if(current < pages.length - 1) {
            pages[current].classList.remove('active');
            current++;
            pages[current].classList.add('active');
        }
    }
    function prevPage() {
        if(current > 0) {
            pages[current].classList.remove('active');
            current--;
            pages[current].classList.add('active');
        }
    }
</script>
</body>
</html>
